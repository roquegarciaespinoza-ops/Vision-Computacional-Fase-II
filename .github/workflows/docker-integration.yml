name: Validar y publicar Fase II
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/docker-integration.yml'
permissions:
  contents: read
concurrency:
  group: fase2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir contenedor
        run: docker build -t vision-fase-ii:ci .
      - name: Ejecutar pruebas dentro del contenedor
        run: docker run --rm vision-fase-ii:ci pytest -q
      - name: Comprobar API HTTP real
        run: |
          docker run -d --name fase2 -p 8000:8000 vision-fase-ii:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/
          docker logs fase2
          docker rm -f fase2
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publicar imagen versionada
        run: |
          docker tag vision-fase-ii:ci roquegarciaespinoza/vision-computacional-fase-ii:fase2-baseline
          docker tag vision-fase-ii:ci roquegarciaespinoza/vision-computacional-fase-ii:sha-${GITHUB_SHA::12}
          docker push roquegarciaespinoza/vision-computacional-fase-ii:fase2-baseline
          docker push roquegarciaespinoza/vision-computacional-fase-ii:sha-${GITHUB_SHA::12}
