name: Generar entregables PDF y Word
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/generar_entregables.py'
      - '.github/workflows/generar-entregables.yml'
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar librerías de documentos
        run: python -m pip install python-docx==1.2.0 reportlab==4.4.4
      - name: Generar PDF y Word
        run: python scripts/generar_entregables.py
      - name: Guardar evidencia descargable
        uses: actions/upload-artifact@v4
        with:
          name: entregables-pdf-word
          path: entregables/
      - name: Incorporar documentos al repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entregables/
          if ! git diff --cached --quiet; then
            git commit -m "Publicar manual e informe PDF y Word generados"
            git push
          fi
